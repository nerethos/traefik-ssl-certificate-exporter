name: Go

on: [push, pull_request]

jobs:
  build:
    name: Go Build

    runs-on: ubuntu-latest

    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Set up Go 
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build go programm
      run: go build
